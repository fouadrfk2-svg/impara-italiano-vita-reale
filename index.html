<!-- What this policy REALLY closes: `script-src 'self'` - the execution of code
     this directory did not provide. The course has not a single inline script and
     not a single on*= attribute, so standing at 'self' costs nothing.
     What it does NOT close: style. `style-src` must have 'unsafe-inline', because
     166 places in assets/js build a style="..." attribute out of computed values;
     neither a nonce nor a hash can come into being in a file with no server and no
     build step.
     What it is worth: with no server and no login there is nowhere for XSS to come
     from. What remains is a defence against foreign code attached from outside - a
     browser extension, or a dependency that some day arrives over the network.
     `frame-ancestors` is deliberately absent: browsers ignore it in <meta>, and a
     rule that does nothing looks in the list exactly like one that works.

     `connect-src` names four hosts, and that list is the honest statement of
     where this page can send anything. They are the four model providers a
     student may hand a key to for checking open answers; the course reaches them
     only after the student has entered a key and agreed. Note what the shape of
     this buys: the set of providers is closed HERE, by the browser, so no bug in
     the JavaScript can widen it. A wildcard would have cost nothing to write and
     given that up. `default-src 'self'` does not cover connect-src by extension —
     the directive is explicit, so it had to be edited by hand. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; media-src 'self' blob:; connect-src 'self' https://generativelanguage.googleapis.com https://api.groq.com https://api.openai.com https://api.anthropic.com; worker-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">

    <!-- The footer is a SIBLING of <main>, not a child of it: `Views.shell.set`
         replaces the innerHTML of #main at every route, so a footer living
         inside would vanish at the first change of screen and come back only
         on a reload. Standing here it is written once and shows on every
         screen.

         That property is the reason the privacy notice is linked from here
         and not from the rail: the rail lists things to do, and this is a
         thing to read, but it has to be one click away from wherever the
         student happens to be standing.

         The name needs no data-i18n, being a personal name. The link does,
         and gets it for free: I18n.apply() runs over the whole document,
         not over #main, so it reaches outside the part the router
         rewrites. -->
